      <rect x="104" y="4" width="4" height="34" rx="2" fill="#FF7844"/>
      <rect x="112" y="16" width="4" height="22" rx="2" fill="#FFA07A"/>
      <rect x="120" y="0" width="4" height="38" rx="2" fill="#FF512F"/>
      <rect x="128" y="12" width="4" height="26" rx="2" fill="#F09819"/>
      <rect x="136" y="22" width="4" height="16" rx="2" fill="#8E9AA8"/>
      <rect x="144" y="10" width="4" height="28" rx="2" fill="#8E9AA8"/>
      <rect x="152" y="18" width="4" height="20" rx="2" fill="#8E9AA8"/>
      <rect x="160" y="8" width="4" height="30" rx="2" fill="#8E9AA8"/>
      <rect x="168" y="14" width="4" height="24" rx="2" fill="#8E9AA8"/>
      <rect x="176" y="6" width="4" height="32" rx="2" fill="#8E9AA8"/>
      <rect x="184" y="16" width="4" height="22" rx="2" fill="#8E9AA8"/>
      <rect x="192" y="12" width="4" height="26" rx="2" fill="#8E9AA8"/>
      <rect x="200" y="20" width="4" height="18" rx="2" fill="#8E9AA8"/>
      <rect x="208" y="8" width="4" height="30" rx="2" fill="#8E9AA8"/>
      <rect x="216" y="14" width="4" height="24" rx="2" fill="#8E9AA8"/>
      <rect x="224" y="18" width="4" height="20" rx="2" fill="#8E9AA8"/>
      <rect x="232" y="10" width="4" height="28" rx="2" fill="#8E9AA8"/>
      <rect x="240" y="15" width="4" height="23" rx="2" fill="#8E9AA8"/>
      <rect x="248" y="22" width="4" height="16" rx="2" fill="#8E9AA8"/>
      <rect x="256" y="12" width="4" height="26" rx="2" fill="#8E9AA8"/>
      <rect x="264" y="18" width="4" height="20" rx="2" fill="#8E9AA8"/>
      <rect x="272" y="10" width="4" height="28" rx="2" fill="#8E9AA8"/>
