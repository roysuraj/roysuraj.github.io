<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#302b63"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="artGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF512F"/>
      <stop offset="100%" stop-color="#DD2476"/>
    </linearGradient>
    <linearGradient id="sliderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF512F"/>
      <stop offset="100%" stop-color="#F09819"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="800" height="500" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Subtle ambient glow -->
  <circle cx="240" cy="250" r="180" fill="#FF512F" opacity="0.12" filter="blur(40px)"/>

  <!-- Left: Album Art Card -->
  <g transform="translate(60, 60)" filter="url(#shadow)">
    <rect width="260" height="260" rx="20" fill="url(#artGrad)"/>
    <!-- Kesariya Saffron Art Concept -->
    <circle cx="130" cy="130" r="90" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
    <circle cx="130" cy="130" r="60" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="3"/>
    <circle cx="130" cy="130" r="30" fill="#ffffff" fill-opacity="0.9"/>
    <text x="130" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">BRAHMĀSTRA</text>
    <!-- Live High Bitrate Badge -->
    <rect x="15" y="15" width="80" height="26" rx="6" fill="rgba(0,0,0,0.6)" backdrop-filter="blur(8px)"/>
    <text x="55" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#FFD700" text-anchor="middle">320 KBPS</text>
  </g>

  <!-- Right: Track Info & Controls -->
  <g transform="translate(360, 75)">
    <!-- Now Playing Tag -->
    <rect x="0" y="0" width="120" height="26" rx="13" fill="rgba(255,81,47,0.2)" stroke="rgba(255,81,47,0.5)" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#FF512F"/>
    <text x="64" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#FFA07A" text-anchor="middle" letter-spacing="1">NOW PLAYING</text>

    <!-- Track Title -->
    <text x="0" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="#ffffff" letter-spacing="-0.5">Kesariya</text>
    
    <!-- Artists -->
    <text x="0" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#C3CCDB">Arijit Singh · Pritam · Amitabh B.</text>
    <text x="0" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#8E9AA8">Album: Brahmāstra (Part One: Shiva)</text>

    <!-- Live Audio Waveform Bars -->
    <g transform="translate(0, 150)">
      <rect x="0" y="12" width="4" height="26" rx="2" fill="#FF512F"/>
      <rect x="8" y="4" width="4" height="34" rx="2" fill="#FF7844"/>
      <rect x="16" y="16" width="4" height="22" rx="2" fill="#FFA07A"/>
