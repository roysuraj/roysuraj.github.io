    <!-- Progress Slider -->
    <g transform="translate(0, 215)">
      <rect x="0" y="4" width="380" height="6" rx="3" fill="rgba(255,255,255,0.15)"/>
      <rect x="0" y="4" width="190" height="6" rx="3" fill="url(#sliderGrad)"/>
      <circle cx="190" cy="7" r="7" fill="#ffffff" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.5))"/>
      <text x="0" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#C3CCDB">02:14</text>
      <text x="380" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#8E9AA8" text-anchor="end">04:28</text>
    </g>

    <!-- Player Action Buttons -->
    <g transform="translate(0, 275)">
      <!-- Shuffle -->
      <circle cx="20" cy="20" r="18" fill="rgba(255,255,255,0.06)"/>
      <path d="M14 15L18 15L22 25L26 25M23 21L26 25L23 29M14 25L18 25L19.5 21.5M26 15L22 15L20.5 18.5M23 11L26 15L23 19" stroke="#8E9AA8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      
      <!-- Previous -->
      <circle cx="85" cy="20" r="22" fill="rgba(255,255,255,0.08)"/>
      <path d="M78 14V26M92 14L82 20L92 26V14Z" fill="#C3CCDB"/>

      <!-- Play / Pause (Active) -->
      <circle cx="160" cy="20" r="28" fill="url(#artGrad)" filter="drop-shadow(0 4px 12px rgba(255,81,47,0.5))"/>
      <rect x="151" y="11" width="6" height="18" rx="2" fill="#ffffff"/>
      <rect x="163" y="11" width="6" height="18" rx="2" fill="#ffffff"/>

      <!-- Next -->
      <circle cx="235" cy="20" r="22" fill="rgba(255,255,255,0.08)"/>
      <path d="M242 14V26M228 14L238 20L228 26V14Z" fill="#C3CCDB"/>

      <!-- Favorite Heart -->
      <circle cx="300" cy="20" r="18" fill="rgba(255,81,47,0.15)"/>
      <path d="M300 25L298.5 23.5C293.5 19 290 16 290 12.5C290 9.5 292.5 7 295.5 7C297.2 7 298.8 8 300 9.5C301.2 8 302.8 7 304.5 7C307.5 7 310 9.5 310 12.5C310 16 306.5 19 301.5 23.5L300 25Z" fill="#FF512F"/>
      
      <!-- Up Next Badge -->
      <rect x="335" y="7" width="45" height="26" rx="8" fill="rgba(255,255,255,0.08)"/>
      <text x="357" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#C3CCDB" text-anchor="middle">QUEUE</text>
    </g>
  </g>

  <!-- Bottom Mini-bar / Audio Specs -->
  <g transform="translate(60, 420)">
    <rect width="680" height="50" rx="14" fill="rgba(0,0,0,0.35)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="24" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#ffffff">🎵 Next in Queue:</text>
    <text x="130" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#FFD700">Teri Galliyan · Ankit Tiwari</text>
    <text x="656" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#7EE6D7" text-anchor="end">Dolby Atmos · Lossless Audio</text>
  </g>
