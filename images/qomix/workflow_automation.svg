<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460">
  <defs>
    <linearGradient id="nodeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#388bfd"/>
    </linearGradient>
    <linearGradient id="nodeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#238636"/>
      <stop offset="100%" stop-color="#2ea043"/>
    </linearGradient>
    <linearGradient id="nodeGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8957e5"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>
    <linearGradient id="nodeGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#da3633"/>
      <stop offset="100%" stop-color="#f85149"/>
    </linearGradient>
  </defs>

  <rect width="800" height="460" rx="20" fill="#0d1117"/>

  <!-- Canvas Dot Grid Background -->
  <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.5" fill="#21262d"/>
  </pattern>
  <rect width="800" height="460" rx="20" fill="url(#dotGrid)"/>

  <!-- Top Title -->
  <g transform="translate(40, 35)">
    <text x="0" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#f0f6fc">⚡ Visual Workflow Automation &amp; Pipeline Engine</text>
    <text x="0" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#8b949e">Low-code / Pro-code orchestration engine connecting 120+ SaaS APIs with sub-millisecond execution</text>
  </g>

  <!-- Flow Nodes & Connections -->
  <!-- Connection Curve 1: Trigger to Validator -->
  <path d="M 210 200 C 250 200, 260 200, 290 200" fill="none" stroke="#58a6ff" stroke-width="3" stroke-dasharray="6 4"/>
  <!-- Connection Curve 2: Validator to Multi-branch -->
  <path d="M 450 180 C 490 180, 500 130, 540 130" fill="none" stroke="#3fb950" stroke-width="3"/>
  <path d="M 450 220 C 490 220, 500 270, 540 270" fill="none" stroke="#a371f7" stroke-width="3"/>

  <!-- Node 1: Inbound Webhook Trigger -->
  <g transform="translate(50, 140)">
    <rect width="160" height="120" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect width="160" height="32" rx="12" fill="url(#nodeGrad1)"/>
    <rect y="20" width="160" height="12" fill="url(#nodeGrad1)"/>
    <text x="12" y="21" font-family="sans-serif" font-size="11" font-weight="800" fill="#ffffff">WEBHOOK TRIGGER</text>
    <text x="12" y="60" font-family="sans-serif" font-size="12" font-weight="700" fill="#f0f6fc">B2B Payload Ingest</text>
    <text x="12" y="80" font-family="monospace" font-size="10" fill="#8b949e">POST /v1/events</text>
    <rect x="12" y="94" width="60" height="16" rx="4" fill="#238636" fill-opacity="0.3"/>
    <text x="42" y="106" font-family="sans-serif" font-size="9" font-weight="700" fill="#3fb950" text-anchor="middle">200 OK</text>
  </g>

  <!-- Node 2: Data Transformation & Validation -->
  <g transform="translate(290, 140)">
    <rect width="160" height="120" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect width="160" height="32" rx="12" fill="url(#nodeGrad2)"/>
    <rect y="20" width="160" height="12" fill="url(#nodeGrad2)"/>
    <text x="12" y="21" font-family="sans-serif" font-size="11" font-weight="800" fill="#ffffff">LOGIC ENGINE</text>
    <text x="12" y="60" font-family="sans-serif" font-size="12" font-weight="700" fill="#f0f6fc">Schema Validation</text>
    <text x="12" y="80" font-family="monospace" font-size="10" fill="#8b949e">filter(seats &gt; 50)</text>
    <rect x="12" y="94" width="75" height="16" rx="4" fill="#1f6feb" fill-opacity="0.3"/>
    <text x="49" y="106" font-family="sans-serif" font-size="9" font-weight="700" fill="#58a6ff" text-anchor="middle">MATCHED</text>
  </g>

  <!-- Node 3: CRM & Database Sync -->
  <g transform="translate(540, 70)">
    <rect width="180" height="110" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect width="180" height="32" rx="12" fill="url(#nodeGrad3)"/>
    <rect y="20" width="180" height="12" fill="url(#nodeGrad3)"/>
    <text x="12" y="21" font-family="sans-serif" font-size="11" font-weight="800" fill="#ffffff">ENTERPRISE SYNC</text>
    <text x="12" y="60" font-family="sans-serif" font-size="12" font-weight="700" fill="#f0f6fc">PostgreSQL Upsert</text>
    <text x="12" y="80" font-family="monospace" font-size="10" fill="#8b949e">Latency: 14ms</text>
  </g>

  <!-- Node 4: Real-time Alert & Slack Dispatch -->
  <g transform="translate(540, 210)">
    <rect width="180" height="110" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect width="180" height="32" rx="12" fill="url(#nodeGrad4)"/>
    <rect y="20" width="180" height="12" fill="url(#nodeGrad4)"/>
    <text x="12" y="21" font-family="sans-serif" font-size="11" font-weight="800" fill="#ffffff">ALERT NOTIFICATION</text>
    <text x="12" y="60" font-family="sans-serif" font-size="12" font-weight="700" fill="#f0f6fc">Slack / Teams Webhook</text>
    <text x="12" y="80" font-family="monospace" font-size="10" fill="#8b949e">Status: Delivered</text>
  </g>

  <!-- Execution Status Footer -->
  <g transform="translate(40, 390)">
    <rect width="720" height="42" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <circle cx="20" cy="21" r="5" fill="#3fb950"/>
    <text x="35" y="25" font-family="sans-serif" font-size="12" font-weight="700" fill="#f0f6fc">Live Pipeline State: <tspan fill="#3fb950">HEALTHY &amp; ACTIVE</tspan></text>
    <text x="700" y="25" font-family="monospace" font-size="11" fill="#8b949e" text-anchor="end">Execution Time: 42ms · Zero Dropped Events</text>
  </g>
</svg>
